name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server/config.ini:/config.ini
    networks:
      - testing_net

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - CLI_NAME=DummyName1
      - CLI_SURNAME=DummySurname1
      - CLI_ID_NUMBER=12345678
      - CLI_DATE_OF_BIRTH=1999-07-10
      - CLI_BET_NUMBER=1111
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-1.csv:/agency.csv
    networks:
      - testing_net
    depends_on:
      - server

  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
      - CLI_NAME=DummyName2
      - CLI_SURNAME=DummySurname2
      - CLI_ID_NUMBER=12345678
      - CLI_DATE_OF_BIRTH=1999-07-10
      - CLI_BET_NUMBER=1112
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-2.csv:/agency.csv
    networks:
      - testing_net
    depends_on:
      - server

  client3:
    container_name: client3
