      - server

  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - CLI_NAME=DummyName4
      - CLI_SURNAME=DummySurname4
      - CLI_ID_NUMBER=12345678
      - CLI_DATE_OF_BIRTH=1999-07-10
      - CLI_BET_NUMBER=1114
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-4.csv:/agency.csv
    networks:
      - testing_net
    depends_on:
      - server

  client5:
    container_name: client5
